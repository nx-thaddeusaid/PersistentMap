name: API Contract Tests

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "PersistentMap server URL"
        required: false
        default: "http://roguewar.org"
  schedule:
    # Run daily at 06:00 UTC to catch silent regressions
    - cron: "0 6 * * *"

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pytest requests
      - name: Run contract tests
        env:
          ROGUEWAR_SERVER_URL: ${{ github.event.inputs.server_url || 'http://roguewar.org' }}
        run: pytest tests/ -v --tb=short
        working-directory: PersistentMap
